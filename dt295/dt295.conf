; PIX-SMB400 で動かす dt295 serve の設定 (置き場所は /data/local/tmp/dt295/dt295.conf)。
; Mirakurun の chroot からも同じパスで見えるように、すべて /data/local/tmp の下に置く。
; raw-TS モードなので、ファームウェアは不要。
[dt295]
state-dir = /data/local/tmp/dt295
socket = /data/local/tmp/dt295/dt295.sock

; 使う個体ごとに 1 つ (シリアル番号は dt295 list で)。
; raw-ts = true: スクランブルされたままの TS を出し、本体の b21dec が解除する (dt295-tuner.sh)
[unit AB12345678]
raw-ts = true
